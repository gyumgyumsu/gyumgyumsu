<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작은책상전시 - Tiny Desk Exhibition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#F3F5F8',
              card: '#FFFFFF',
              darkCard: '#0F172A',
              blue: '#0055FF',
              lightBlue: '#EBF2FF',
              lime: '#C4F039',
              textPrimary: '#0F172A',
              textSecondary: '#64748B',
              textMuted: '#94A3B8',
              border: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F3F5F8;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    .card-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen font-sans pb-12 antialiased">

  <div class="max-w-md md:max-w-4xl mx-auto px-4 pt-6 pb-4">
    <header class="mb-6">
      <div class="flex items-start justify-between">
        <div>
          <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-brand-lightBlue text-brand-blue mb-2 tracking-wide uppercase">
            Architectural Exhibition
          </span>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-brand-textPrimary">
            작은책상전시
          </h1>
          <p class="text-sm md:text-base font-semibold text-brand-blue mt-0.5">
            Tiny Desk Exhibition
          </p>
        </div>
        <div class="relative">
          <div class="w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-brand-lime flex items-center justify-center shadow-md transform rotate-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-textPrimary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
        </div>
      </div>

      <div class="mt-6 flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-brand-textMuted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input type="text" id="searchInput" placeholder="건축가 또는 사무소 검색..." 
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-brand-border rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent transition-all shadow-sm">
        </div>
        <div class="flex gap-2">
          <button id="bookmarkFilterBtn" onclick="toggleBookmarkFilter()" 
            class="px-4 py-2.5 rounded-xl border border-brand-border bg-white text-xs font-bold text-brand-textSecondary hover:bg-slate-50 flex items-center gap-1.5 transition-all shadow-sm">
            <svg id="bookmarkFilterIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-brand-textMuted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span>북마크 (<span id="bookmarkCount">0</span>)</span>
          </button>
        </div>
      </div>
    </header>

    <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 custom-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
      <button onclick="filterDate('all')" class="date-tab active px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-brand-blue text-white shadow-sm" data-date="all">
        전체 일정
      </button>
      <button onclick="filterDate('10월 31일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="10월 31일">
        10/31 (토)
      </button>
      <button onclick="filterDate('11월 1일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 1일">
        11/01 (일)
      </button>
      <button onclick="filterDate('11월 2일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 2일">
        11/02 (월)
      </button>
      <button onclick="filterDate('11월 4일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 4일">
        11/04 (수)
      </button>
      <button onclick="filterDate('11월 5일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 5일">
        11/05 (목)
      </button>
      <button onclick="filterDate('11월 6일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 6일">
        11/06 (금)
      </button>
      <button onclick="filterDate('11월 7일')" class="date-tab px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all bg-white text-brand-textSecondary border border-brand-border hover:bg-slate-50" data-date="11월 7일">
        11/07 (토)
      </button>
    </div>

    <main id="timetableContainer" class="space-y-3">
    </main>
  </div>

  <script>
    const scheduleData = [
      { id: 1, date: "10월 31일", time: "11:00 AM", office: "사사건건 건축사사무소", architect: "전중섭", link: "https://search.naver.com/search.naver?query=사사건건+건축사사무소" },
      { id: 2, date: "10월 31일", time: "1:00 PM", office: "BCHO Partners", architect: "조병수", link: "https://www.bchoarchitects.com" },
      { id: 3, date: "10월 31일", time: "1:00 PM", office: "CAC", architect: "정다영 + 김희정 + 정성규 + 곽승찬", link: "https://search.naver.com/search.naver?query=CAC+건축" },
      { id: 4, date: "10월 31일", time: "2:00 PM", office: "다이아거날 써츠", architect: "김사라", link: "http://diagonalthoughts.com" },
      { id: 5, date: "10월 31일", time: "2:00 PM", office: "(주)포머티브건축사사무소", architect: "고영성", link: "http://www.formative-architects.com" },
      { id: 6, date: "10월 31일", time: "3:00 PM", office: "LIFE 건축사사무소", architect: "한지영 + 황수용", link: "https://lifearchitects.kr" },
      { id: 7, date: "11월 1일", time: "11:00 AM", office: "(주)종합건축사사무소 시건축", architect: "류재은", link: "https://search.naver.com/search.naver?query=종합건축사사무소+시건축" },
      { id: 8, date: "11월 1일", time: "11:00 AM", office: "드로잉웍스", architect: "김영배", link: "http://drawingworks.co.kr" },
      { id: 9, date: "11월 1일", time: "1:00 PM", office: "(주)코어건축사사무소", architect: "유종수 + 김빈", link: "http://www.co-re.kr" },
      { id: 10, date: "11월 1일", time: "1:00 PM", office: "(주)디아건축사사무소", architect: "정현아", link: "http://www.diachronic.co.kr" },
      { id: 11, date: "11월 1일", time: "2:00 PM", office: "건축공방", architect: "박수정 + 심희준", link: "http://www.gongbang.in" },
      { id: 12, date: "11월 1일", time: "3:00 PM", office: "문도호제", architect: "임태병", link: "https://search.naver.com/search.naver?query=문도호제" },
      { id: 13, date: "11월 2일", time: "11:00 AM", office: "삶것건축사사무소", architect: "양수인", link: "http://lifethings.in" },
      { id: 14, date: "11월 4일", time: "10:00 AM", office: "황두진건축사사무소", architect: "황두진", link: "http://www.doojinhwang.haebang.net" },
      { id: 15, date: "11월 4일", time: "2:00 PM", office: "푸하하하프렌즈", architect: "윤한진 + 한승재 + 한양규", link: "http://fhhhfriends.com" },
      { id: 16, date: "11월 5일", time: "1:00 PM", office: "솔토지빈건축사사무소", architect: "조남호", link: "http://www.soltozibin.com" },
      { id: 17, date: "11월 5일", time: "2:30 PM", office: "오헤제 건축", architect: "이해든 + 최재필", link: "http://ohese.com" },
      { id: 18, date: "11월 6일", time: "10:00 AM", office: "구보건축", architect: "조윤희 + 홍지학", link: "http://gubo.kr" },
      { id: 19, date: "11월 6일", time: "1:00 PM", office: "운생동건축사사무소", architect: "장윤규 + 신창훈", link: "http://www.usdspace.com" },
      { id: 20, date: "11월 6일", time: "1:00 PM", office: "마인드맵건축사사무소", architect: "최하영", link: "https://search.naver.com/search.naver?query=마인드맵건축사사무소" },
      { id: 21, date: "11월 6일", time: "1:00 PM", office: "건축사사무소 김이홍아키텍츠", architect: "김이홍", link: "http://www.eehongkim.com" },
      { id: 22, date: "11월 6일", time: "1:00 PM", office: "원오원 아키텍스", architect: "최욱", link: "http://www.101architects.com" },
      { id: 23, date: "11월 6일", time: "3:00 PM", office: "일구구공 도시건축 건축사사무소(주)", architect: "윤근주 + 황정환", link: "http://1990ua.com" },
      { id: 24, date: "11월 7일", time: "11:00 AM", office: "RoA architects", architect: "김경도", link: "http://roaarchitects.com" },
      { id: 25, date: "11월 7일", time: "12:00 PM", office: "요앞건축사사무소", architect: "류인근 + 김도란 + 정상경", link: "http://yoap.kr" },
      { id: 26, date: "11월 7일", time: "1:00 PM", office: "건축사사무소 서가", architect: "박혜선 + 오승현", link: "http://seoga.co.kr" },
      { id: 27, date: "11월 7일", time: "1:00 PM", office: "제이파트너스 건축사사무소", architect: "배정현 폴 + 심은지", link: "https://search.naver.com/search.naver?query=제이파트너스+건축사사무소" },
      { id: 28, date: "11월 7일", time: "1:00 PM", office: "낫낫아키텍츠", architect: "안호정", link: "https://search.naver.com/search.naver?query=낫낫아키텍츠" },
      { id: 29, date: "11월 7일", time: "1:00 PM", office: "소수 건축사사무소", architect: "고석홍 + 김미희", link: "http://sosuam.com" },
      { id: 30, date: "11월 7일", time: "2:00 PM", office: "에이코랩 건축사사무소", architect: "정이삭 + 홍진표", link: "http://a-colab.com" },
      { id: 31, date: "11월 7일", time: "3:00 PM", office: "비건축사사무소", architect: "윤은주 + 오정근", link: "https://search.naver.com/search.naver?query=비건축사사무소" }
    ];

    let currentDateFilter = 'all';
    let searchQuery = '';
    let isOnlyBookmarked = false;
    let bookmarks = JSON.parse(localStorage.getItem('tiny_desk_bookmarks') || '[]');

    function updateBookmarkCount() {
      document.getElementById('bookmarkCount').innerText = bookmarks.length;
    }

    function toggleBookmark(id) {
      if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(item => item !== id);
      } else {
        bookmarks.push(id);
      }
      localStorage.setItem('tiny_desk_bookmarks', JSON.stringify(bookmarks));
      updateBookmarkCount();
      renderSchedule();
    }

    function toggleBookmarkFilter() {
      isOnlyBookmarked = !isOnlyBookmarked;
      const btn = document.getElementById('bookmarkFilterBtn');
      const icon = document.getElementById('bookmarkFilterIcon');
      
      if (isOnlyBookmarked) {
        btn.classList.add('bg-brand-blue', 'text-white', 'border-brand-blue');
        btn.classList.remove('bg-white', 'text-brand-textSecondary', 'border-brand-border');
        icon.classList.add('text-white');
        icon.classList.remove('text-brand-textMuted');
      } else {
        btn.classList.remove('bg-brand-blue', 'text-white', 'border-brand-blue');
        btn.classList.add('bg-white', 'text-brand-textSecondary', 'border-brand-border');
        icon.classList.remove('text-white');
        icon.classList.add('text-brand-textMuted');
      }
      renderSchedule();
    }

    function filterDate(date) {
      currentDateFilter = date;
      document.querySelectorAll('.date-tab').forEach(tab => {
        if (tab.dataset.date === date) {
          tab.classList.add('bg-brand-blue', 'text-white', 'shadow-sm');
          tab.classList.remove('bg-white', 'text-brand-textSecondary', 'border', 'border-brand-border');
        } else {
          tab.classList.remove('bg-brand-blue', 'text-white', 'shadow-sm');
          tab.classList.add('bg-white', 'text-brand-textSecondary', 'border', 'border-brand-border');
        }
      });
      renderSchedule();
    }

    function renderSchedule() {
      const container = document.getElementById('timetableContainer');
      
      const filtered = scheduleData.filter(item => {
        const matchesDate = currentDateFilter === 'all' || item.date === currentDateFilter;
        const matchesSearch = item.office.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.architect.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesBookmark = !isOnlyBookmarked || bookmarks.includes(item.id);
        return matchesDate && matchesSearch && matchesBookmark;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-brand-border my-6">
            <svg class="h-10 w-10 text-brand-textMuted mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-sm font-bold text-brand-textPrimary">검색 조건에 해당 세션이 없습니다.</p>
            <p class="text-xs text-brand-textSecondary mt-1">다른 날짜 선택 또는 검색어를 확인해 주세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((item) => {
        const isBookmarked = bookmarks.includes(item.id);
        
        const cardBgClass = isBookmarked ? 'bg-brand-darkCard text-white' : 'bg-white text-brand-textPrimary';
        const officeColorClass = isBookmarked ? 'text-white' : 'text-brand-textPrimary';
        const architectColorClass = isBookmarked ? 'text-slate-300' : 'text-brand-textSecondary';
        const dateBadgeBgClass = isBookmarked ? 'bg-slate-800 text-sky-400' : 'bg-brand-lightBlue text-brand-blue';
        const timeBadgeBgClass = isBookmarked ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-700';
        const linkBtnClass = isBookmarked 
          ? 'bg-slate-800 text-white hover:bg-slate-700' 
          : 'bg-slate-100 text-brand-textPrimary hover:bg-slate-200';
        const bookmarkBtnClass = isBookmarked
          ? 'bg-amber-400 text-brand-darkCard'
          : 'bg-slate-100 text-slate-400 hover:text-amber-500 hover:bg-amber-50';

        return `
          <div class="card-transition ${cardBgClass} rounded-2xl p-4 md:p-5 border border-brand-border shadow-sm hover:shadow-md flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-xs font-extrabold px-2.5 py-1 rounded-md ${dateBadgeBgClass}">
                    ${item.date}
                  </span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-md ${timeBadgeBgClass}">
                    ${item.time}
                  </span>
                </div>

                <button onclick="toggleBookmark(${item.id})" class="p-2 rounded-xl transition-all ${bookmarkBtnClass}">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="${isBookmarked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                  </svg>
                </button>
              </div>

              <h2 class="text-base md:text-lg font-bold tracking-tight ${officeColorClass} mb-1">
                ${item.office}
              </h2>
              <p class="text-xs md:text-sm font-medium ${architectColorClass} mb-4">
                ${item.architect}
              </p>
            </div>

            <div class="pt-2 border-t border-slate-100/10">
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                class="w-full py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${linkBtnClass}">
                <span>사무소 정보 / 웹사이트</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderSchedule();
    });

    updateBookmarkCount();
    renderSchedule();
  </script>
</body>
</html>
